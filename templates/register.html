{% extends "base.html" %}
{% block title %}Register — Aypee Quotation System{% endblock %}
{% block content_full %}
<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <div class="d-flex justify-content-center">
        <div style="width:56px;height:56px;background:#CC0000;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:bold">A</div>
      </div>
      <h2>AYPEE INDUSTRIES</h2>
      <p>Create New Account</p>
    </div>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="full_name" class="form-control" required placeholder="Your full name">
      </div>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required placeholder="Choose a username">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required placeholder="Choose a password">
      </div>
      <button type="submit" class="btn btn-primary w-100 mb-3">
        <i class="bi bi-person-plus"></i> Register
      </button>
    </form>
    <div class="text-center">
      <a href="{{ url_for('login') }}" class="text-decoration-none" style="color:#CC0000">Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
