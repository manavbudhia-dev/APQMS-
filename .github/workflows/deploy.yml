name: Deploy to server

# main branch par har push ke baad latest code server par chala jaata hai.
# Actions tab se "Run workflow" dabakar manually bhi chala sakte hain.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check secrets
        id: check
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          # cPanel shared hosting (no SSH): CPANEL_HOST / CPANEL_USER / CPANEL_API_TOKEN — see DEPLOY_CPANEL.md
          # Own server with SSH:          SERVER_HOST / SERVER_USER / SSH_PRIVATE_KEY
          echo "cpanel=$([ -n "$CPANEL_HOST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ok=$([ -n "$HOST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ -z "$HOST" ] && [ -z "$CPANEL_HOST" ]; then
            echo "::warning::Deploy secrets set nahi hain (CPANEL_* ya SERVER_*) - deploy skip. DEPLOY_CPANEL.md dekhein."
          fi

      - name: Checkout (for the cPanel deploy script)
        if: steps.check.outputs.cpanel == 'true'
        uses: actions/checkout@v4

      - name: Deploy to cPanel (Git Version Control + API token)
        if: steps.check.outputs.cpanel == 'true'
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_REPO_ROOT: ${{ vars.CPANEL_REPO_ROOT }}
        run: python3 tools/cpanel_deploy.py "$GITHUB_SHA"

      - name: Deploy over SSH
        if: steps.check.outputs.ok == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ vars.APP_DIR }}
          BRANCH: main
          REPO: apqms-
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 25m
          envs: APP_DIR,BRANCH,REPO
          script: |
            set -e
            APP_DIR="${APP_DIR:-$HOME/$REPO}"
            # non-interactive SSH shell mein node / pm2 ka PATH load karo
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"
            export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "::error::$APP_DIR server par nahi mila. Ek baar clone karein: git clone https://github.com/manavbudhia-dev/$REPO.git $APP_DIR"
              exit 1
            fi
            cd "$APP_DIR"
            echo "Deploying $REPO ($BRANCH) in $APP_DIR"
            # quotation.db git mein tracked hai - live data ko pull se bachane ke liye backup + restore
            BACKUP="/tmp/quotation.db.$(date +%s)"
            [ -f quotation.db ] && cp quotation.db "$BACKUP"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            [ -f "$BACKUP" ] && cp "$BACKUP" quotation.db
            [ -d .venv ] || python3 -m venv .venv
            .venv/bin/pip install -q -r requirements.txt
            if ! command -v pm2 >/dev/null 2>&1 && ! systemctl cat apqms >/dev/null 2>&1; then
              mkdir -p tmp && touch tmp/restart.txt   # Passenger / cPanel restart
            else
              if systemctl cat apqms >/dev/null 2>&1; then
                sudo systemctl restart apqms
              elif pm2 describe apqms >/dev/null 2>&1; then
                pm2 restart apqms --update-env
              else
                pm2 start .venv/bin/python --name apqms --interpreter none -- server.py
              fi
              pm2 save >/dev/null 2>&1 || true
            fi
            echo "Deploy ho gaya: $(git log -1 --format='%h %s')"
